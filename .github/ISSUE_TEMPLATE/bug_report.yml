name: Bug report
description: Something in the application or pipeline does not work
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** attach video files — describe
        the source instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open START_HERE.bat
        2. Choose a video
        3. Press Estimate time
        4. See error
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Activity log
      description: Paste the relevant output. Redact any private paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Output of Check setup
      description: Press Check setup (F5) and paste the result.
      render: text
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: NVIDIA RTX 5070, 12 GB, driver 5xx.xx
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source video characteristics
      description: Resolution, duration, codec, frame rate. Not the file.
      placeholder: 1280x720, 41 min, h264, ~15 fps variable
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I ran Check setup and it passed, or I included the failure above
          required: true
        - label: I have not attached any video file
          required: true
